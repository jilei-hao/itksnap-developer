<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" width="1180" height="860" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <!-- Arrowheads are baked as filled triangles (plain paths, not SVG markers) and
       every shaft is a path (not a bare line element), so the whole figure is
       ordinary, editable geometry in Adobe Illustrator. Each arrow = a shaft path
       plus a triangle head at its tip (8px long, 8px base, tip at the end point). -->

  <rect x="0" y="0" width="1180" height="860" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">ITK-SNAP Agentic API — End-to-End Flow</text>
  <text x="590" y="56" text-anchor="middle" font-size="13" fill="#64748b">workspace-first: create → propose → apply (headless) → then, optionally, the human corrects in a live GUI</text>

  <!-- ===== lane headers ===== -->
  <g>
    <rect x="50" y="70" width="180" height="40" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="140" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4338ca">Agent (itksnap-mcp)</text>

    <rect x="290" y="70" width="190" height="40" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="385" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0e7490">Model server (itksnap-dls)</text>

    <rect x="530" y="70" width="190" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="625" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">Workspace (base)</text>

    <rect x="765" y="70" width="200" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="865" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">ITK-SNAP GUI (optional)</text>

    <rect x="1000" y="70" width="150" height="40" rx="8" fill="#fef2f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="1075" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#be123c">Human expert</text>
  </g>

  <!-- ===== lifelines (dashed vertical paths, no heads) ===== -->
  <g stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 5" fill="none">
    <path d="M140,110 L140,835"/>
    <path d="M385,110 L385,835"/>
    <path d="M625,110 L625,835"/>
    <path d="M865,110 L865,835"/>
    <path d="M1075,110 L1075,835"/>
  </g>

  <!-- activation bars -->
  <rect x="379" y="188" width="12" height="40" fill="#a5f3fc" opacity="0.7"/>
  <rect x="619" y="150" width="12" height="34" fill="#fde68a" opacity="0.9"/>
  <rect x="619" y="330" width="12" height="52" fill="#fde68a" opacity="0.9"/>
  <rect x="859" y="488" width="12" height="212" fill="#a7f3d0" opacity="0.8"/>

  <!-- ===== phase 1: no GUI needed ===== -->
  <g font-size="11.5" fill="#334155">
    <!-- 0 create_workspace (right, workspace/orange) -->
    <path d="M140,152 L619,152" fill="none" stroke="#b45309" stroke-width="1.7"/>
    <path d="M619,152 L611,148 L611,156 z" fill="#b45309"/>
    <text x="380" y="145" text-anchor="middle" font-weight="600" fill="#92400e">0 · create_workspace(ct): itksnap-wt (main image + empty seg)</text>

    <!-- 1 propose (right, call/slate) -->
    <path d="M140,190 L379,190" fill="none" stroke="#334155" stroke-width="1.6"/>
    <path d="M379,190 L371,186 L371,194 z" fill="#334155"/>
    <text x="258" y="183" text-anchor="middle" font-weight="600">1 · propose(ct): upload + run_automatic</text>

    <!-- 2 return labels (left, return/cyan, dashed) -->
    <path d="M391,226 L140,226" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M140,226 L148,222 L148,230 z" fill="#0e7490"/>
    <text x="262" y="219" text-anchor="middle" fill="#0e7490">2 · label volume + {id:name}  (48 structures)</text>

    <!-- 3 gate note -->
    <rect x="34" y="244" width="212" height="28" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="4 4"/>
    <text x="140" y="262" text-anchor="middle" fill="#92400e">3 · gate: auto-accept | route-to-human (planned)</text>

    <!-- 4 write mask note -->
    <rect x="34" y="280" width="212" height="28" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="140" y="298" text-anchor="middle" fill="#3730a3">4 · write_label_mask: restore CT geometry</text>

    <!-- 5 apply headless (right, workspace/orange) -->
    <path d="M140,336 L619,336" fill="none" stroke="#b45309" stroke-width="1.7"/>
    <path d="M619,336 L611,332 L611,340 z" fill="#b45309"/>
    <text x="380" y="329" text-anchor="middle" font-weight="600" fill="#92400e">5 · apply(label): merge into workspace seg (headless) · actor = agent</text>
  </g>

  <!-- 5b workspace processing box -->
  <rect x="512" y="346" width="226" height="30" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="625" y="365" text-anchor="middle" font-size="11" fill="#92400e">before/after → audit record + log</text>

  <g font-size="11.5" fill="#334155">
    <!-- 6 audit return (left, return/cyan, dashed) -->
    <path d="M619,394 L140,394" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M140,394 L148,390 L148,398 z" fill="#0e7490"/>
    <text x="380" y="387" text-anchor="middle" fill="#0e7490">6 · audit record {changed_voxels: 1169665, bbox, before/after}</text>
  </g>

  <!-- banner: phase 1 needs no GUI -->
  <rect x="300" y="408" width="560" height="26" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-dasharray="3 4"/>
  <text x="580" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">steps 0–6 need no running ITK-SNAP — the workspace is complete on disk</text>

  <!-- divider: human disposes (dropped down to clear the banner above and beat 7 below) -->
  <path d="M30,472 L1160,472" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="2 6"/>
  <rect x="420" y="460" width="340" height="24" rx="12" fill="#fef2f2" stroke="#f43f5e"/>
  <text x="590" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#be123c">— human disposes (optional): open a live GUI and correct —</text>

  <!-- ===== phase 2: optional live GUI (shifted +36 for breathing room) ===== -->
  <g font-size="11.5" fill="#334155">
    <!-- 7 open_in_itksnap (right, green) -->
    <path d="M140,514 L859,514" fill="none" stroke="#059669" stroke-width="1.6"/>
    <path d="M859,514 L851,510 L851,518 z" fill="#059669"/>
    <text x="500" y="507" text-anchor="middle" font-weight="600" fill="#047857">7 · open_in_itksnap(): launch  -w workspace  --agent-listen</text>

    <!-- 8 GUI loads workspace (left, workspace/orange, dashed) -->
    <path d="M859,550 L631,550" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M631,550 L639,546 L639,554 z" fill="#b45309"/>
    <text x="745" y="543" text-anchor="middle" fill="#92400e">8 · load workspace (-w)</text>

    <!-- 9 human paints (left, call/slate) -->
    <path d="M1075,592 L871,592" fill="none" stroke="#334155" stroke-width="1.6"/>
    <path d="M871,592 L879,588 L879,596 z" fill="#334155"/>
    <text x="972" y="585" text-anchor="middle" font-weight="600">9 · paintbrush correction</text>
  </g>

  <!-- 10 ITK human commit box -->
  <rect x="740" y="610" width="256" height="56" rx="9" fill="#fff1f2" stroke="#fb7185" stroke-width="1.4"/>
  <text x="868" y="630" text-anchor="middle" font-size="11.5" font-weight="700" fill="#be123c">10 · commit → record{actor: human}</text>
  <text x="868" y="649" text-anchor="middle" font-size="10.5" fill="#334155">BuildFromDeltas · tag auto-resets to human</text>

  <g font-size="11.5" fill="#334155">
    <!-- 11 read_audit (right, call/slate) -->
    <path d="M140,690 L859,690" fill="none" stroke="#334155" stroke-width="1.6"/>
    <path d="M859,690 L851,686 L851,694 z" fill="#334155"/>
    <text x="500" y="683" text-anchor="middle" font-weight="600">11 · read_audit()  (live socket)</text>

    <!-- 12 human diff return (left, return/cyan, dashed) -->
    <path d="M859,726 L140,726" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M140,726 L148,722 L148,730 z" fill="#0e7490"/>
    <text x="500" y="719" text-anchor="middle" fill="#0e7490">12 · human-tagged correction diff</text>
  </g>

  <!-- note: persist -->
  <rect x="740" y="740" width="256" height="26" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="4 4"/>
  <text x="868" y="757" text-anchor="middle" font-size="10.5" fill="#92400e">the human saves → workspace updated on disk</text>

  <!-- legend -->
  <g font-size="11" fill="#475569">
    <path d="M60,795 L95,795" fill="none" stroke="#334155" stroke-width="1.6"/>
    <path d="M95,795 L87,791 L87,799 z" fill="#334155"/>
    <text x="102" y="799">call</text>

    <path d="M160,795 L195,795" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M195,795 L187,791 L187,799 z" fill="#0e7490"/>
    <text x="202" y="799">return</text>

    <path d="M270,795 L305,795" fill="none" stroke="#b45309" stroke-width="1.6"/>
    <path d="M305,795 L297,791 L297,799 z" fill="#b45309"/>
    <text x="312" y="799">workspace (headless)</text>

    <rect x="452" y="789" width="14" height="12" fill="#a7f3d0" opacity="0.8"/>
    <text x="472" y="799">active (processing)</text>
  </g>
</svg>
