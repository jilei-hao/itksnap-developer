<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 596" width="980" height="596"
     font-family="Helvetica,Arial,'Segoe UI',Roboto,sans-serif">

  <rect x="0" y="0" width="980" height="596" fill="#ffffff"/>

  <!-- ================= title ================= -->
  <text x="490" y="36" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">What comes back: the audit record for one committed edit</text>
  <text x="490" y="62" text-anchor="middle" font-size="15" fill="#64748b">values are from the verified end-to-end run — a proposed left upper lung lobe applied into an ITK-SNAP workspace</text>

  <!-- ================= row backgrounds ================= -->
  <rect x="20" y="170" width="940" height="34" fill="#f8fafc"/>
  <rect x="20" y="204" width="940" height="48" fill="#eef2ff"/>
  <rect x="20" y="300" width="940" height="48" fill="#f8fafc"/>
  <rect x="20" y="382" width="940" height="48" fill="#f8fafc"/>
  <rect x="20" y="478" width="940" height="34" fill="#f8fafc"/>

  <!-- accent on the actor row -->
  <rect x="20" y="204" width="4" height="48" fill="#6366f1"/>

  <!-- ================= header row ================= -->
  <rect x="20" y="96" width="940" height="40" fill="#0f172a"/>
  <text x="32" y="121" font-size="14" font-weight="700" fill="#ffffff">Field</text>
  <text x="227" y="121" font-size="14" font-weight="700" fill="#ffffff">Live run — agent apply</text>
  <text x="557" y="121" font-size="14" font-weight="700" fill="#ffffff">Why a downstream consumer needs it</text>

  <!-- ================= rules ================= -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="20" y1="170" x2="960" y2="170"/>
    <line x1="20" y1="204" x2="960" y2="204"/>
    <line x1="20" y1="252" x2="960" y2="252"/>
    <line x1="20" y1="300" x2="960" y2="300"/>
    <line x1="20" y1="348" x2="960" y2="348"/>
    <line x1="20" y1="382" x2="960" y2="382"/>
    <line x1="20" y1="430" x2="960" y2="430"/>
    <line x1="20" y1="478" x2="960" y2="478"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="215" y1="96" x2="215" y2="512"/>
    <line x1="545" y1="96" x2="545" y2="512"/>
  </g>
  <rect x="20" y="96" width="940" height="416" fill="none" stroke="#94a3b8" stroke-width="1.4"/>

  <!-- ================= rows ================= -->
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#0f172a">
    <text x="32" y="158">op</text>
    <text x="32" y="192">timestamp</text>
    <text x="32" y="233" font-weight="700" fill="#3730a3">actor</text>
    <text x="32" y="281">changed_voxels</text>
    <text x="32" y="329">rle_count</text>
    <text x="32" y="370">time_point</text>
    <text x="32" y="411">bbox</text>
    <text x="32" y="459">before_counts</text>
    <text x="32" y="500">after_counts</text>
  </g>

  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#334155">
    <text x="227" y="158">"Agent apply (proposal)"</text>
    <text x="227" y="192">"2026-07-19T02:26:20Z"</text>
    <text x="227" y="233" font-weight="700" fill="#3730a3">"agent"</text>
    <text x="227" y="281">1169665</text>
    <text x="227" y="329" fill="#94a3b8">—  (see note)</text>
    <text x="227" y="370">0</text>
    <text x="227" y="402">min [84, 2, 0]</text>
    <text x="227" y="420">max [247, 189, 180]</text>
    <text x="227" y="459">{"0": 1169665}</text>
    <text x="227" y="500">{"1": 1169665}</text>
  </g>

  <g font-size="13.5" fill="#334155">
    <text x="557" y="158">which editing tool produced the change</text>
    <text x="557" y="192">ISO-8601 UTC — orders edits within a session</text>

    <text x="557" y="226" font-weight="600" fill="#3730a3">machine output or expert judgment — decides whether</text>
    <text x="557" y="244" font-weight="600" fill="#3730a3">these voxels are training-grade ground truth</text>

    <text x="557" y="274">magnitude of the correction — a cheap proxy for how</text>
    <text x="557" y="292">far off the model was on this case</text>

    <text x="557" y="322">edit complexity: one contiguous fill vs. many</text>
    <text x="557" y="340">scattered touch-ups</text>

    <text x="557" y="370">which frame of a 4D series the edit applies to</text>

    <text x="557" y="402">where the correction is — a crop region for focused</text>
    <text x="557" y="420">review or targeted re-training</text>

    <text x="557" y="450">what was overwritten — background vs. another label,</text>
    <text x="557" y="468">which reveals the model's confusion pairs</text>

    <text x="557" y="500">what those voxels became</text>
  </g>

  <!-- ================= notes ================= -->
  <g font-size="13" fill="#475569">
    <text x="20" y="538">Captured at a single commit chokepoint, so the record is identical whichever tool made the edit — paintbrush, polygon, 3D spray, threshold, or an agent's apply.</text>
    <text x="20" y="558">A human correction returns the same structure with <tspan font-family="'SF Mono',Menlo,Consolas,monospace" font-weight="700" fill="#be123c">actor: "human"</tspan>; nothing else about the record changes.</text>
    <text x="20" y="578" fill="#64748b">Note: every field listed is emitted with every record; the <tspan font-family="'SF Mono',Menlo,Consolas,monospace">rle_count</tspan> value was not captured in the logged excerpt of this particular run.</text>
  </g>
</svg>
