<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- MOCKUP banner -->
  <rect x="0" y="0" width="1200" height="34" fill="#fdf0d5"/>
  <text x="24" y="23" font-size="15" font-weight="600" fill="#8a5a00">CONCEPT MOCK-UP — not implemented. Illustrates the proposed W4 workflow.</text>

  <!-- App window -->
  <rect x="24" y="54" width="1152" height="620" rx="8" fill="#f4f5f7" stroke="#c9ced6" stroke-width="1.5"/>
  <rect x="24" y="54" width="1152" height="38" rx="8" fill="#e6e9ee"/>
  <rect x="24" y="80" width="1152" height="12" fill="#e6e9ee"/>
  <circle cx="48" cy="73" r="6" fill="#d9d9d9"/><circle cx="68" cy="73" r="6" fill="#d9d9d9"/><circle cx="88" cy="73" r="6" fill="#d9d9d9"/>
  <text x="600" y="79" font-size="15" font-weight="600" fill="#4a5260" text-anchor="middle">ITK-SNAP — cardiac_CTA_patient012.nii.gz</text>

  <!-- Slice view area (placeholder) -->
  <g>
    <rect x="404" y="108" width="376" height="272" rx="4" fill="#1c1f26"/>
    <rect x="792" y="108" width="368" height="272" rx="4" fill="#1c1f26"/>
    <rect x="404" y="392" width="376" height="266" rx="4" fill="#1c1f26"/>
    <rect x="792" y="392" width="368" height="266" rx="4" fill="#1c1f26"/>
    <!-- suggestion of a heart in the first panel -->
    <ellipse cx="592" cy="244" rx="96" ry="80" fill="#3a3f4a"/>
    <ellipse cx="575" cy="238" rx="52" ry="46" fill="#e05252" opacity="0.75"/>
    <ellipse cx="575" cy="238" rx="30" ry="26" fill="#4a90d9" opacity="0.85"/>
    <ellipse cx="628" cy="252" rx="30" ry="34" fill="#6ac46a" opacity="0.75"/>
    <text x="592" y="356" font-size="13" fill="#7b828e" text-anchor="middle">axial</text>
    <text x="976" y="356" font-size="13" fill="#7b828e" text-anchor="middle">coronal</text>
    <text x="592" y="640" font-size="13" fill="#7b828e" text-anchor="middle">sagittal</text>
    <text x="976" y="640" font-size="13" fill="#7b828e" text-anchor="middle">3D</text>
  </g>

  <!-- Left panel -->
  <rect x="44" y="108" width="344" height="550" rx="6" fill="#ffffff" stroke="#c9ced6"/>
  <text x="66" y="140" font-size="18" font-weight="700" fill="#232833">Automatic Segmentation</text>
  <line x1="66" y1="154" x2="366" y2="154" stroke="#e3e6ea" stroke-width="1"/>

  <!-- Model select -->
  <text x="66" y="184" font-size="14" fill="#5a626e">Model</text>
  <rect x="66" y="194" width="300" height="38" rx="5" fill="#fbfbfc" stroke="#b9c0ca"/>
  <text x="80" y="219" font-size="15" fill="#232833">TotalSegmentator</text>
  <path d="M344 209 l8 0 l-4 6 Z" fill="#5a626e"/>

  <!-- Subset select -->
  <text x="66" y="262" font-size="14" fill="#5a626e">Structures</text>
  <rect x="66" y="272" width="300" height="38" rx="5" fill="#fbfbfc" stroke="#b9c0ca"/>
  <text x="80" y="297" font-size="15" fill="#232833">Cardiac subset (7 labels)</text>
  <path d="M344 287 l8 0 l-4 6 Z" fill="#5a626e"/>

  <!-- Primary action -->
  <rect x="66" y="334" width="300" height="46" rx="6" fill="#2f6fb5"/>
  <text x="216" y="363" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Segment</text>
  <text x="216" y="400" font-size="13.5" fill="#6b7280" text-anchor="middle">No scribbles, no seed points.</text>

  <!-- Progress -->
  <line x1="66" y1="422" x2="366" y2="422" stroke="#e3e6ea"/>
  <text x="66" y="450" font-size="13.5" fill="#5a626e">Running on DLS server · 00:12</text>
  <rect x="66" y="462" width="270" height="10" rx="5" fill="#e3e6ea"/>
  <rect x="66" y="462" width="176" height="10" rx="5" fill="#2f6fb5"/>
  <g>
    <circle cx="356" cy="467" r="11" fill="#eef0f3" stroke="#b9c0ca"/>
    <path d="M352 463 l8 8 M360 463 l-8 8" stroke="#5a626e" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="66" y="494" font-size="12.5" fill="#8a919c">The window stays responsive; the run can be cancelled.</text>

  <!-- Results -->
  <line x1="66" y1="512" x2="366" y2="512" stroke="#e3e6ea"/>
  <text x="66" y="538" font-size="14" font-weight="600" fill="#232833">Labels produced</text>
  <g font-size="14" fill="#333a45">
    <rect x="66" y="550" width="14" height="14" rx="3" fill="#e05252"/><text x="90" y="562">LV myocardium</text>
    <rect x="66" y="574" width="14" height="14" rx="3" fill="#4a90d9"/><text x="90" y="586">LV blood pool</text>
    <rect x="66" y="598" width="14" height="14" rx="3" fill="#6ac46a"/><text x="90" y="610">RV blood pool</text>
    <rect x="216" y="550" width="14" height="14" rx="3" fill="#f0c419"/><text x="240" y="562">Left atrium</text>
    <rect x="216" y="574" width="14" height="14" rx="3" fill="#b06ac4"/><text x="240" y="586">Right atrium</text>
    <rect x="216" y="598" width="14" height="14" rx="3" fill="#e8833a"/><text x="240" y="610">Aorta</text>
  </g>
  <text x="66" y="640" font-size="12.5" fill="#8a919c">Real anatomical names and colours — not "Label 1…7".</text>
</svg>
